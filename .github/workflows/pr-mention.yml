name: Mention PR maintainer

on:
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  pull-requests: write

concurrency:
  group: pr-maintainer-mentions
  cancel-in-progress: false

jobs:
  mention:
    if: github.repository == 'Torch1230/CombatSolver'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mention maintainer on open pull requests
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- combatsolver-pr-maintainer-mention -->';
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            for (const pull of pulls) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull.number,
                per_page: 100,
              });
              if (comments.some(comment =>
                comment.user.type === 'Bot' && comment.body.includes(marker))) {
                core.info(`PR #${pull.number} already mentioned`);
                continue;
              }

              const { data: current } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pull.number,
              });
              if (current.state === 'open') {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull.number,
                  body: `${marker}\n@Torch1230 这个 PR 已开放，请查看。`,
                });
                core.info(`Mentioned maintainer on PR #${pull.number}`);
              }
            }
