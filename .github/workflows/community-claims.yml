name: Community batch claims

on:
  issue_comment:
    types: [created]
  issues:
    types: [assigned, unassigned, labeled, unlabeled, closed, reopened, edited]
  push:
    branches: [main]
    paths:
      - docs/community/publication-ledger.json
      - tools/community/sync-community-claims.py
      - tools/community/test-community-claims.py
      - .github/workflows/community-claims.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: community-batch-claims
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Torch1230/CombatSolver'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify community claim synchronization
        run: python3 tools/community/test-community-claims.py
      - name: Apply claims and sync labels, queue owners, and completion
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        run: python3 tools/community/sync-community-claims.py
